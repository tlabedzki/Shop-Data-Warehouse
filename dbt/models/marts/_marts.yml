version: 2

models:
  - name: mart_daily_sales
    description: Daily sales by channel and category; revenue and margin without VAT, kept units only.
    columns:
      - name: order_date
        data_tests: [not_null]
      - name: net_revenue
        description: Revenue without VAT after discounts and refunds, PLN.
  - name: mart_daily_traffic
    description: Daily sessions, carts, checkouts and orders by channel and device.
    columns:
      - name: conversion_rate
        data_tests:
          - accepted_range:
              arguments: {min_value: 0, max_value: 1}
  - name: mart_customer_cohorts
    description: Customers by month of first sale and months since; customers still buying and their revenue.
    columns:
      - name: months_since_first
        data_tests:
          - accepted_range:
              arguments: {min_value: 0}
